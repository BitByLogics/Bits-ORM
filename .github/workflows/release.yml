name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          server-id: minebit
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Check the tag matches the project version
        run: |
          VERSION=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $VERSION"
            exit 1
          fi

      - name: Build, test and deploy
        run: mvn -B deploy
        env:
          MAVEN_USERNAME: ${{ secrets.MINEBIT_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MINEBIT_PASSWORD }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" target/*.jar --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
